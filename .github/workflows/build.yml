name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            artifact: lantui-macos-arm64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: lantui-linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: lantui-linux-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage binary
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/lantui" "dist/${{ matrix.artifact }}"
          chmod +x "dist/${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  artifacts:
    name: collect artifacts
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum lantui-* | tee SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: lantui-binaries
          path: |
            dist/lantui-macos-arm64
            dist/lantui-linux-x64
            dist/lantui-linux-arm64
            dist/SHA256SUMS
            install.sh
          if-no-files-found: error

      - name: Publish nightly
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly
          prerelease: true
          make_latest: false
          files: |
            dist/lantui-macos-arm64
            dist/lantui-linux-x64
            dist/lantui-linux-arm64
            dist/SHA256SUMS
            install.sh

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/lantui-macos-arm64
            dist/lantui-linux-x64
            dist/lantui-linux-arm64
            dist/SHA256SUMS
            install.sh
